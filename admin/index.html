<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ-панель | KISELEVY CREO</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0b;
    --panel:#151210;
    --panel-border:#2e2521;
    --lilac-pale:#f0e9dc;
    --amethyst:#c4a3a6;
    --text:#ede7dd;
    --text-dim:#b7a99b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Inter', 'Segoe UI', Roboto, Arial, sans-serif;
    background:var(--bg);color:var(--text);line-height:1.5;
  }
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 24px;border-bottom:1px solid var(--panel-border);
  }
  .logo{font-family:'Space Grotesk', sans-serif;font-weight:700;color:var(--amethyst);font-size:1.05rem}
  .logout-btn{
    background:transparent;border:1px solid var(--panel-border);color:var(--text-dim);
    border-radius:8px;padding:8px 14px;font-family:inherit;font-size:0.85rem;cursor:pointer;
  }
  .logout-btn:hover{color:var(--text);border-color:var(--amethyst)}
  .container{max-width:900px;margin:0 auto;padding:24px}
  .tabs{display:flex;gap:8px;margin-bottom:24px}
  .tab-btn{
    background:var(--panel);border:1px solid var(--panel-border);color:var(--text-dim);
    border-radius:999px;padding:9px 18px;font-family:inherit;font-size:0.9rem;cursor:pointer;
  }
  .tab-btn.active{background:var(--amethyst);color:var(--bg);border-color:var(--amethyst);font-weight:600}
  .tab-panel{display:none}
  .tab-panel.active{display:block}
  .form-card{
    background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;
    padding:22px;margin-bottom:24px;
  }
  .form-card h2{font-family:'Space Grotesk', sans-serif;font-size:1.05rem;color:var(--lilac-pale);margin-bottom:16px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:0.82rem;color:var(--text-dim);margin-bottom:6px}
  .field input, .field textarea, .field select{
    width:100%;background:var(--bg);border:1px solid var(--panel-border);border-radius:8px;
    padding:10px 12px;color:var(--text);font-family:inherit;font-size:0.9rem;
  }
  .field input:focus, .field textarea:focus, .field select:focus{outline:none;border-color:var(--amethyst)}
  .field textarea{resize:vertical;min-height:80px}
  .row{display:flex;gap:12px}
  .row .field{flex:1}
  .submit-btn{
    background:var(--amethyst);color:var(--bg);border:none;border-radius:8px;
    padding:11px 20px;font-family:inherit;font-size:0.9rem;font-weight:600;cursor:pointer;
  }
  .submit-btn:hover{opacity:0.9}
  .submit-btn:disabled{opacity:0.5;cursor:default}
  .msg{font-size:0.85rem;margin-top:10px;display:none}
  .msg.ok{color:#9bc98f}
  .msg.err{color:#e29b9b}
  .list{display:flex;flex-direction:column;gap:12px}
  .item-card{
    background:var(--panel);border:1px solid var(--panel-border);border-radius:12px;
    padding:16px;display:flex;gap:14px;align-items:flex-start;
  }
  .item-card img{width:64px;height:64px;object-fit:cover;border-radius:8px;flex-shrink:0}
  .item-body{flex:1;min-width:0}
  .item-title{font-weight:600;color:var(--lilac-pale);font-size:0.92rem}
  .item-sub{font-size:0.8rem;color:var(--text-dim);margin-bottom:4px}
  .item-text{font-size:0.85rem;color:var(--text-dim);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .delete-btn{
    background:transparent;border:1px solid var(--panel-border);color:#e29b9b;
    border-radius:8px;padding:7px 12px;font-family:inherit;font-size:0.8rem;cursor:pointer;flex-shrink:0;
  }
  .delete-btn:hover{border-color:#e29b9b}
  .empty{color:var(--text-dim);font-size:0.88rem;text-align:center;padding:24px}
  .stars{color:var(--amethyst);font-size:0.85rem}
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:24px}
  .stat-card{background:var(--panel);border:1px solid var(--panel-border);border-radius:12px;padding:20px;text-align:center}
  .stat-value{font-family:'Space Grotesk', sans-serif;font-size:2rem;font-weight:700;color:var(--amethyst)}
  .stat-label{font-size:0.82rem;color:var(--text-dim);margin-top:4px}
  .visits-chart{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:10px}
  .visits-bar{flex:1;background:var(--amethyst);border-radius:3px 3px 0 0;min-height:2px;position:relative}
  .visits-bar:hover::after{
    content:attr(data-tip);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);
    background:var(--bg);border:1px solid var(--panel-border);border-radius:6px;padding:4px 8px;
    font-size:0.72rem;white-space:nowrap;color:var(--text);margin-bottom:4px;
  }
  .lead-contact{font-size:0.85rem;color:var(--amethyst);margin-bottom:4px}
  .lead-sphere{font-size:0.82rem;color:var(--text-dim);margin-bottom:4px}
</style>
</head>
<body>
<header>
  <span class="logo">KISELEVY&nbsp;CREO · Админ-панель</span>
  <button class="logout-btn" id="logoutBtn">Выйти</button>
</header>

<div class="container">
  <div class="tabs">
    <button class="tab-btn active" data-tab="stats">Статистика</button>
    <button class="tab-btn" data-tab="leads">Заявки</button>
    <button class="tab-btn" data-tab="testimonials">Отзывы</button>
    <button class="tab-btn" data-tab="portfolio">Портфолио</button>
  </div>

  <div class="tab-panel active" id="tab-stats">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="statVisits30">-</div>
        <div class="stat-label">посещений за 30 дней</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statVisitsAll">-</div>
        <div class="stat-label">посещений всего</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statLeads">-</div>
        <div class="stat-label">заявок всего</div>
      </div>
    </div>
    <div class="form-card">
      <h2>Посещения по дням (последние 30)</h2>
      <div id="visitsChart" class="visits-chart"></div>
    </div>
  </div>

  <div class="tab-panel" id="tab-leads">
    <div class="list" id="leadsList"></div>
  </div>

  <div class="tab-panel active" id="tab-testimonials">
    <div class="form-card">
      <h2>Добавить отзыв</h2>
      <form id="testiForm">
        <div class="row">
          <div class="field">
            <label>Имя</label>
            <input type="text" id="testiName" required>
          </div>
          <div class="field">
            <label>Сфера / должность</label>
            <input type="text" id="testiRole">
          </div>
        </div>
        <div class="field">
          <label>Текст отзыва</label>
          <textarea id="testiText" required></textarea>
        </div>
        <div class="row">
          <div class="field">
            <label>Оценка (1-5)</label>
            <select id="testiRating">
              <option value="5" selected>5</option>
              <option value="4">4</option>
              <option value="3">3</option>
              <option value="2">2</option>
              <option value="1">1</option>
            </select>
          </div>
          <div class="field">
            <label>Фото (не обязательно)</label>
            <input type="file" id="testiPhoto" accept="image/*">
          </div>
        </div>
        <button type="submit" class="submit-btn" id="testiSubmit">Добавить отзыв</button>
        <p class="msg" id="testiMsg"></p>
      </form>
    </div>
    <div class="list" id="testiList"></div>
  </div>

  <div class="tab-panel" id="tab-portfolio">
    <div class="form-card">
      <h2>Добавить работу в портфолио</h2>
      <form id="pfForm">
        <div class="row">
          <div class="field">
            <label>Название</label>
            <input type="text" id="pfTitle" required>
          </div>
          <div class="field">
            <label>Категория</label>
            <select id="pfCategory">
              <option value="chatbot">Чат-бот</option>
              <option value="automation">Автоматизация</option>
              <option value="ai">AI-система</option>
              <option value="site">Сайт</option>
              <option value="marketing">Маркетинг</option>
              <option value="other">Другое</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>Описание</label>
          <textarea id="pfDesc" required></textarea>
        </div>
        <div class="field">
          <label>Фото проекта</label>
          <input type="file" id="pfPhoto" accept="image/*" required>
        </div>
        <button type="submit" class="submit-btn" id="pfSubmit">Добавить в портфолио</button>
        <p class="msg" id="pfMsg"></p>
      </form>
    </div>
    <div class="list" id="pfList"></div>
  </div>
</div>

<script>
  document.querySelectorAll('.tab-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
      document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
  });

  document.getElementById('logoutBtn').addEventListener('click', async function(){
    await fetch('/api/admin/logout', {method:'POST'});
    window.location.href = '/admin/login.html';
  });

  function resizeImage(file, maxSize){
    return new Promise(function(resolve, reject){
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = function(){
        const img = new Image();
        img.onerror = reject;
        img.onload = function(){
          let w = img.width, h = img.height;
          if(w > maxSize || h > maxSize){
            if(w > h){ h = Math.round(h * maxSize / w); w = maxSize; }
            else { w = Math.round(w * maxSize / h); h = maxSize; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.85));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function requireAuthOrRedirect(){
    const resp = await fetch('/api/admin/testimonials');
    if(resp.status === 401){
      window.location.href = '/admin/login.html';
      return false;
    }
    return true;
  }

  function showMsg(el, text, ok){
    el.textContent = text;
    el.className = 'msg ' + (ok ? 'ok' : 'err');
    el.style.display = 'block';
    setTimeout(function(){ el.style.display = 'none'; }, 4000);
  }

  async function loadTestimonials(){
    const resp = await fetch('/api/admin/testimonials');
    if(resp.status === 401){ window.location.href = '/admin/login.html'; return; }
    const data = await resp.json();
    const wrap = document.getElementById('testiList');
    wrap.innerHTML = '';
    if(!data.items || !data.items.length){
      wrap.innerHTML = '<p class="empty">Добавленных отзывов пока нет</p>';
      return;
    }
    data.items.forEach(function(item){
      const card = document.createElement('div');
      card.className = 'item-card';
      card.innerHTML =
        (item.photo ? '<img src="' + item.photo + '" alt="">' : '') +
        '<div class="item-body">' +
          '<div class="stars">' + '★'.repeat(item.rating) + '☆'.repeat(5 - item.rating) + '</div>' +
          '<div class="item-title"></div>' +
          '<div class="item-sub"></div>' +
          '<div class="item-text"></div>' +
        '</div>' +
        '<button class="delete-btn">Удалить</button>';
      card.querySelector('.item-title').textContent = item.name;
      card.querySelector('.item-sub').textContent = item.role || '';
      card.querySelector('.item-text').textContent = item.text;
      card.querySelector('.delete-btn').addEventListener('click', async function(){
        if(!confirm('Удалить отзыв «' + item.name + '»?')) return;
        await fetch('/api/admin/testimonials', {
          method:'DELETE', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({id: item.id})
        });
        loadTestimonials();
      });
      wrap.appendChild(card);
    });
  }

  async function loadPortfolio(){
    const resp = await fetch('/api/admin/portfolio');
    if(resp.status === 401){ window.location.href = '/admin/login.html'; return; }
    const data = await resp.json();
    const wrap = document.getElementById('pfList');
    wrap.innerHTML = '';
    if(!data.items || !data.items.length){
      wrap.innerHTML = '<p class="empty">Добавленных работ пока нет</p>';
      return;
    }
    data.items.forEach(function(item){
      const card = document.createElement('div');
      card.className = 'item-card';
      card.innerHTML =
        '<img src="' + item.image + '" alt="">' +
        '<div class="item-body">' +
          '<div class="item-title"></div>' +
          '<div class="item-sub"></div>' +
          '<div class="item-text"></div>' +
        '</div>' +
        '<button class="delete-btn">Удалить</button>';
      card.querySelector('.item-title').textContent = item.title;
      card.querySelector('.item-sub').textContent = item.category;
      card.querySelector('.item-text').textContent = item.description;
      card.querySelector('.delete-btn').addEventListener('click', async function(){
        if(!confirm('Удалить работу «' + item.title + '»?')) return;
        await fetch('/api/admin/portfolio', {
          method:'DELETE', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({id: item.id})
        });
        loadPortfolio();
      });
      wrap.appendChild(card);
    });
  }

  document.getElementById('testiForm').addEventListener('submit', async function(e){
    e.preventDefault();
    const btn = document.getElementById('testiSubmit');
    const msg = document.getElementById('testiMsg');
    btn.disabled = true;
    try{
      const photoFile = document.getElementById('testiPhoto').files[0];
      const photo = photoFile ? await resizeImage(photoFile, 400) : null;
      const resp = await fetch('/api/admin/testimonials', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          name: document.getElementById('testiName').value,
          role: document.getElementById('testiRole').value,
          text: document.getElementById('testiText').value,
          rating: document.getElementById('testiRating').value,
          photo: photo
        })
      });
      if(!resp.ok) throw new Error('request failed');
      this.reset();
      showMsg(msg, 'Отзыв добавлен', true);
      loadTestimonials();
    }catch(err){
      showMsg(msg, 'Не получилось добавить, попробуйте ещё раз', false);
    }finally{
      btn.disabled = false;
    }
  });

  document.getElementById('pfForm').addEventListener('submit', async function(e){
    e.preventDefault();
    const btn = document.getElementById('pfSubmit');
    const msg = document.getElementById('pfMsg');
    const photoFile = document.getElementById('pfPhoto').files[0];
    if(!photoFile){
      showMsg(msg, 'Прикрепите фото проекта', false);
      return;
    }
    btn.disabled = true;
    try{
      const image = await resizeImage(photoFile, 1400);
      const resp = await fetch('/api/admin/portfolio', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          title: document.getElementById('pfTitle').value,
          category: document.getElementById('pfCategory').value,
          description: document.getElementById('pfDesc').value,
          image: image
        })
      });
      if(!resp.ok) throw new Error('request failed');
      this.reset();
      showMsg(msg, 'Работа добавлена в портфолио', true);
      loadPortfolio();
    }catch(err){
      showMsg(msg, 'Не получилось добавить, попробуйте ещё раз', false);
    }finally{
      btn.disabled = false;
    }
  });

  async function loadStats(){
    const resp = await fetch('/api/admin/stats');
    if(resp.status === 401){ window.location.href = '/admin/login.html'; return; }
    const data = await resp.json();
    document.getElementById('statVisits30').textContent = data.totalVisits30d;
    document.getElementById('statVisitsAll').textContent = data.totalVisitsAll;
    document.getElementById('statLeads').textContent = data.totalLeads;
    const chart = document.getElementById('visitsChart');
    chart.innerHTML = '';
    const max = Math.max.apply(null, data.visitsDaily.map(function(d){ return d.count; }).concat([1]));
    data.visitsDaily.forEach(function(d){
      const bar = document.createElement('div');
      bar.className = 'visits-bar';
      bar.style.height = Math.max(2, Math.round(d.count / max * 100)) + '%';
      bar.setAttribute('data-tip', d.day + ': ' + d.count);
      chart.appendChild(bar);
    });
  }

  async function loadLeads(){
    const resp = await fetch('/api/admin/leads');
    if(resp.status === 401){ window.location.href = '/admin/login.html'; return; }
    const data = await resp.json();
    const wrap = document.getElementById('leadsList');
    wrap.innerHTML = '';
    if(!data.items || !data.items.length){
      wrap.innerHTML = '<p class="empty">Заявок пока нет</p>';
      return;
    }
    data.items.forEach(function(item){
      const card = document.createElement('div');
      card.className = 'item-card';
      const date = new Date(item.createdAt).toLocaleString('ru-RU');
      card.innerHTML =
        '<div class="item-body">' +
          '<div class="item-title"></div>' +
          '<div class="lead-contact"></div>' +
          '<div class="lead-sphere"></div>' +
          '<div class="item-text"></div>' +
          '<div class="item-sub"></div>' +
        '</div>' +
        '<button class="delete-btn">Удалить</button>';
      card.querySelector('.item-title').textContent = item.name || 'Без имени';
      card.querySelector('.lead-contact').textContent = item.contact || '';
      card.querySelector('.lead-sphere').textContent = item.sphere ? 'Сфера: ' + item.sphere : '';
      card.querySelector('.item-text').textContent = item.request || '';
      card.querySelector('.item-sub').textContent = date;
      card.querySelector('.delete-btn').addEventListener('click', async function(){
        if(!confirm('Удалить заявку от «' + (item.name || 'без имени') + '»?')) return;
        await fetch('/api/admin/leads', {
          method:'DELETE', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({id: item.id})
        });
        loadLeads();
      });
      wrap.appendChild(card);
    });
  }

  requireAuthOrRedirect().then(function(ok){
    if(!ok) return;
    loadStats();
    loadLeads();
    loadTestimonials();
    loadPortfolio();
  });
</script>
</body>
</html>
