  BLOCKS.forEach(function(block,bi){
    var wrap=document.createElement('div'); wrap.className='block';
    var head=document.createElement('div'); head.className='block-head';
    head.textContent=block.b[(LANG==='en')?1:(LANG==='sr'?2:0)];
    var card=document.createElement('div'); card.className='card';
    block.q.forEach(function(qrow){
      var text=qrow[(LANG==='en')?1:(LANG==='sr'?2:0)];
      var idx=qi; qi++;
      var qdiv=document.createElement('div'); qdiv.className='q';
      var lab=document.createElement('div'); lab.className='qlabel';
      var num=document.createElement('span'); num.className='num'; num.textContent=(idx+1)+'.';
      var txt=document.createElement('span'); txt.textContent=text;
      lab.appendChild(num); lab.appendChild(txt);
      var ta=document.createElement('textarea');
      ta.setAttribute('data-idx',idx);
      if(store['q'+idx]) ta.value=store['q'+idx];
      ta.addEventListener('input',function(e){
        var k='q'+e.target.getAttribute('data-idx');
        store[k]=e.target.value; save(); prog();
      });
      qdiv.appendChild(lab); qdiv.appendChild(ta);
      card.appendChild(qdiv);
    });
    wrap.appendChild(head); wrap.appendChild(card);
    root.appendChild(wrap);
  });
  if(restore){ prog(); }
}
function prog(){
  var done=0;
  for(var i=0;i<TOTAL;i++){ if((store['q'+i]||'').trim()) done++; }
  document.getElementById('progbar').style.width=Math.round(done/TOTAL*100)+'%';
  document.getElementById('prognum').textContent=done+' / '+TOTAL;
}
function save(){ try{ localStorage.setItem(LS_KEY,JSON.stringify(store)); }catch(e){} }

/* ============ ПЕРЕКЛЮЧЕНИЕ ЯЗЫКА ============ */
function setLang(l){
  LANG=(l==='ru'||l==='en'||l==='sr')?l:'ru';
  document.querySelectorAll('.lang-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.lang===l); });
  applyStatic();
  render(true);
}
function applyUI(id){
  var el=document.getElementById(id);
  if(el && UI[LANG]) el.textContent=(UI[LANG]['btn.'+id])||el.textContent;
}

/* ============ ОТПРАВКА ============ */
function collect(){
  var out={};
  for(var i=0;i<TOTAL;i++){ var v=(store['q'+i]||'').trim(); if(v) out[i]=v; }
  return out;
}
function countAnswered(){ return Object.keys(collect()).length; }

var sending=false;
document.getElementById('sendbtn').addEventListener('click', async function(){
  if(sending) return;
  var msg=document.getElementById('msg');
  var btn=this;
  var fname=document.getElementById('fname').value.trim();
  var fcontact=document.getElementById('fcontact').value.trim();
  msg.className='msg'; msg.textContent='';
  // требуется имя и контакт
  if(!fname||!fcontact){ msg.className='msg err'; msg.textContent=T('err1'); return; }
  if(countAnswered()===0){ msg.className='msg err'; msg.textContent=T('empty'); return; }

  sending=true; btn.disabled=true; btn.textContent=T('btn.sendIng');
  var answers={};
  for(var i=0;i<TOTAL;i++){ var v2=(store['q'+i]||'').trim(); answers['q'+i]=v2; }
  try{
    var resp=await fetch('/api/oprosnik/submit',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name:fname, contact:fcontact, lang:LANG, answers:answers })
    });
    var data=await resp.json();
    if(data && data.ok && data.botLink){
      document.getElementById('formView').style.display='none';
      var dv=document.getElementById('doneView');
      dv.classList.add('show');
      document.getElementById('doneReply').textContent=(data.introReply||'Спасибо!');
      var a=document.getElementById('doneLink');
      a.href=data.botLink;
      a.textContent=(UI[LANG]&&UI[LANG]['tg.btn'])?UI[LANG]['tg.btn']:'Продолжить в Telegram';
      try{ localStorage.removeItem(LS_KEY); }catch(e){}
    } else {
      throw new Error('bad');
    }
  }catch(e){
    msg.className='msg err'; msg.textContent=T('srvErr');
    sending=false; btn.disabled=false; btn.textContent=T('btn.send');
  }
});

/* ============ СТАРТ ============ */
function init(){
  document.querySelectorAll('.lang-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.lang==='ru'); });
  var saved='ru'; try{ saved=localStorage.getItem('site_lang')||'ru'; }catch(e){}
  LANG=(saved==='en'||saved==='sr')?saved:'ru';
  applyStatic();
  setLang(LANG);
  var n=document.getElementById('fname'); n.value=store.name||'';
  n.addEventListener('input',function(){ store.name=n.value; store.fullname=n.value; store.fullName=n.value; save(); });
  var c=document.getElementById('fcontact');
  c.value=store.contact||'';
  c.addEventListener('input',function(){ store.contact=c.value; save(); });
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
