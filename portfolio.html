<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Портфолио | KISELEVY CREO</title>
<meta name="description" content="Новые работы KISELEVY CREO - боты, сайты, нейропомощники и автоматизация под ключ.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<style>
  :root{
    --bg:#0a0a0b;
    --panel:#151210;
    --panel-border:#2e2521;
    --lilac-pale:#f0e9dc;
    --amethyst:#c4a3a6;
    --text:#ede7dd;
    --text-dim:#b7a99b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Inter', 'Segoe UI', Roboto, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.6;
  }
  .container{max-width:1000px;margin:0 auto;padding:56px 24px 80px}
  .logo{
    font-family:'Space Grotesk', sans-serif;font-weight:700;
    color:var(--amethyst);letter-spacing:0.5px;margin-bottom:32px;display:inline-block;
    text-decoration:none;font-size:1.05rem;
  }
  h1{
    font-family:'Space Grotesk', sans-serif;font-size:1.8rem;
    color:var(--lilac-pale);margin-bottom:10px;
  }
  h1 span{color:var(--amethyst)}
  .intro{color:var(--text-dim);font-size:0.95rem;margin-bottom:40px;max-width:560px}
  .portfolio-grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:28px;
  }
  .portfolio-card{
    background:var(--panel);border-radius:16px;overflow:hidden;
    border:1px solid var(--panel-border);
    display:flex;flex-direction:column;
  }
  .portfolio-card img{display:block;width:100%;height:auto}
  .portfolio-card-body{padding:24px}
  .portfolio-card h3{margin-bottom:8px;color:var(--lilac-pale);font-family:'Space Grotesk', sans-serif;font-size:1.05rem}
  .portfolio-card .cat{color:var(--amethyst);font-size:0.78rem;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;display:block}
  .portfolio-card p{font-size:0.9rem;color:var(--text-dim);white-space:pre-wrap}
  .empty{
    background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;
    padding:40px 24px;text-align:center;color:var(--text-dim);font-size:0.95rem;
  }
  .back{
    display:inline-block;margin-top:48px;color:var(--amethyst);
    text-decoration:none;font-size:0.9rem;font-weight:600;
  }
  .back:hover{color:var(--lilac-pale)}
  .scroll-top-btn{
    position:fixed;top:24px;right:24px;z-index:130;
    width:46px;height:46px;border-radius:50%;
    background:var(--amethyst);color:var(--bg);border:none;
    font-size:1.3rem;line-height:1;cursor:pointer;
    box-shadow:0 6px 20px rgba(0,0,0,0.35);
    display:flex;align-items:center;justify-content:center;
    opacity:0;visibility:hidden;transform:translateY(-8px);
    transition:opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
  }
  .scroll-top-btn.visible{opacity:1;visibility:visible;transform:translateY(0)}
  .scroll-top-btn:hover{transform:scale(1.06)}
  @media (max-width:600px){
    .scroll-top-btn{top:16px;right:16px;width:40px;height:40px;font-size:1.1rem}
  }
</style>
</head>
<body>
<div class="container">
  <a class="logo" href="index.html">KISELEVY&nbsp;CREO</a>
  <h1>Наше <span>портфолио</span></h1>
  <p class="intro">Новые работы, которые мы добавляем по мере запуска проектов. Больше кейсов - на <a href="index.html#portfolio" style="color:var(--amethyst)">главной странице</a>.</p>

  <div id="portfolioGrid"></div>

  <a class="back" href="index.html">← Вернуться на сайт</a>
</div>

<button class="scroll-top-btn" id="scrollTopBtn" onclick="scrollToTop()" aria-label="Наверх">↑</button>
<script>
  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function loadPortfolio(){
    const grid = document.getElementById('portfolioGrid');
    try{
      const resp = await fetch('/api/data/portfolio');
      const data = await resp.json();
      if(!data.items || !data.items.length){
        grid.innerHTML = '<p class="empty">Скоро здесь появятся новые работы.</p>';
        return;
      }
      const wrap = document.createElement('div');
      wrap.className = 'portfolio-grid';
      data.items.forEach(function(item){
        const card = document.createElement('div');
        card.className = 'portfolio-card';
        card.innerHTML =
          '<img src="' + item.image + '" alt="' + escapeHtml(item.title) + '">' +
          '<div class="portfolio-card-body">' +
            '<span class="cat"></span>' +
            '<h3></h3>' +
            '<p></p>' +
          '</div>';
        card.querySelector('.cat').textContent = item.category || '';
        card.querySelector('h3').textContent = item.title;
        card.querySelector('p').textContent = item.description;
        wrap.appendChild(card);
      });
      grid.appendChild(wrap);
    }catch(e){
      grid.innerHTML = '<p class="empty">Не получилось загрузить портфолио, попробуйте обновить страницу.</p>';
    }
  }
  loadPortfolio();

  function scrollToTop(){
    window.scrollTo({top:0, behavior:'smooth'});
  }
  (function(){
    const btn = document.getElementById('scrollTopBtn');
    function toggleScrollBtn(){
      btn.classList.toggle('visible', window.scrollY > 400);
    }
    window.addEventListener('scroll', toggleScrollBtn, {passive:true});
    toggleScrollBtn();
  })();
</script>
</body>
</html>
